# =============================================================================
# VÉRTICE APP — POSTGRESQL 16 TUNING (ORACLE CLOUD VM 24 GB RAM / SSD NVMe)
# Arquivo: postgresql.conf
# =============================================================================

# Conectividade de Rede
listen_addresses = '*'
port = 5432
max_connections = 100

# Gerenciamento de Memória (Conservador para coexistir com outros serviços no host)
shared_buffers = 2GB
effective_cache_size = 8GB
maintenance_work_mem = 512MB
work_mem = 16MB

# Otimizações de I/O para SSD NVMe
random_page_cost = 1.1
effective_io_concurrency = 200

# Write Ahead Log (WAL) e Checkpoints
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Processamento Paralelo
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Estatísticas do Query Planner
default_statistics_target = 100

# Localidade e Timezone
timezone = 'UTC'
log_timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Logs de Diagnóstico (consultas lentas acima de 500ms)
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d: '
